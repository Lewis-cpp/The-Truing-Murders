name: Week one deterministic slice

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: '0.12.23'
      - run: uv sync --locked --python 3.12
      - run: uv run --offline ruff format --check src/backend tests/backend
      - run: uv run --offline ruff check src/backend tests/backend
      - run: uv run --offline pytest -q tests/backend/domain tests/backend/application tests/backend/test_cli.py
