name: Week one deterministic slice

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          version: '0.12.23'
      - run: uv sync --locked --python 3.12
      - run: uv run --offline ruff format --check src tests
      - run: uv run --offline ruff check src tests
      - run: uv run --offline pytest -q tests/domain tests/application tests/test_cli.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
