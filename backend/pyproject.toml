[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "the-truing-murders"
version = "0.1.0"
description = "Interactive detective game with deterministic rules and bounded AI characters"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.9,<3",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
truing-play = "backend.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.4,<10",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[tool.hatch.build.targets.wheel.force-include]
"assets/cases/case_001/v1/slice.json" = "backend/case_data/case_001/v1/slice.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The host may export ROS plugins through PYTHONPATH. Enable needed plugins explicitly.
addopts = ["--disable-plugin-autoload", "--strict-markers", "-m", "not live_llm and not performance"]
markers = [
    "unit: isolated deterministic checks",
    "integration: real database and application boundaries",
    "agent: context, memory and expression behavior",
    "rule: evidence, disclosure and judgement rules",
    "state_machine: phases, guards and transitions",
    "api: HTTP contracts and side effects",
    "e2e: browser to database game flows",
    "live_llm: explicitly enabled external model evaluation",
    "performance: controlled latency measurements",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Generated migrations keep long SQL CHECK expressions on one line for review against models.
"src/backend/infrastructure/database/migrations/versions/*.py" = ["E501"]
