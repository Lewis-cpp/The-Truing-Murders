# Static frontend + API reverse proxy. Only this container publishes a port.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API is same-origin for the browser: /api/v1/ proxies to the api service.
    location /api/v1/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Idempotency keys arrive on writes; never buffer them away on errors.
        proxy_buffering off;
    }

    # Static assets are content-hashed by Vite; cache them hard.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
